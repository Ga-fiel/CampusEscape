<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusEscape · 三楼</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="crosshair"></div>
  <div id="lookWarning">👁 老师要回头了</div>
  <div id="noise">嘈杂！</div>

  <div id="suspicion">
    <div class="meter"><div id="suspicionFill"></div></div>
    <span id="suspicionText">0%</span>
  </div>

  <div id="intro">
    <p><b>WASD</b> 移动　<b>鼠标</b> 观察</p>
    <p><b>按住 Shift</b> 蹲下　<b>E</b> 拾取　<b>F</b> 推门/交互</p>
    <p class="goal">目标：从教室后门出去，看看走廊里有什么</p>
  </div>

  <div id="crouch">蹲行中</div>
  <div id="interact">[F] 推门</div>
  <div id="danger"></div>
</div>

<div id="ending" class="hidden">
  <div class="panel ending-panel">
    <h2 id="endingTitle"></h2>
    <div id="endingBody"></div>
    <p id="endingAction">[R] 从座位重来</p>
  </div>
</div>

<div id="start">
  <div class="panel">
    <h1>CampusEscape</h1>
    <p class="sub">三楼 · 我的教室</p>
    <p class="hint" id="startHint">WASD 移动 · 按住 Shift 蹲下 · 鼠标观察 · E 推门</p>
    <button id="startBtn">点击开始</button>
    <p class="note">老师背身写板书时移动，回头时别暴露。撞到桌椅会发出声音。</p>
  </div>
</div>

<script>
// 调试/截图模式：?shot=1 隐藏开始遮罩，并把 shader 编译等错误显示到屏幕上
window.__errs = [];
const _ce = console.error;
console.error = function (...a) { window.__errs.push(a.map(String).join(' ')); _ce.apply(console, a); };
window.addEventListener('error', e => window.__errs.push(String(e.message)));
if (new URLSearchParams(location.search).has('shot')) {
  document.getElementById('start').classList.add('hidden');
  const box = document.createElement('div');
  box.id = 'errbox';
  box.style.cssText = 'position:fixed;left:0;top:0;z-index:999;color:#f66;background:#000a;font:12px monospace;max-width:100vw;white-space:pre-wrap';
  document.body.appendChild(box);
  setInterval(() => { box.textContent = window.__errs.join('\n'); }, 300);
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
