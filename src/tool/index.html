<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>场景编辑器 · CampusEscape</title>
<link rel="stylesheet" href="./tool.css">
<script type="importmap">
{
  "imports": {
    "three": "../../vendor/three/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>

<!-- 顶栏 -->
<header id="topbar">
  <span class="brand">场景编辑器</span>
  <span class="sep"></span>
  <button id="btnOpen" title="Ctrl+O">打开场景 (见 FORMAT.md)</button>
  <button id="btnExport" title="Ctrl+S">导出 JSON</button>
  <span class="sep"></span>
  <button id="btnAdd" title="新增物体">+ 新增物体</button>
  <span class="sep"></span>
  <label class="toggle"><input type="checkbox" id="chkGrid" checked> 网格</label>
  <label class="toggle"><input type="checkbox" id="chkAxes" checked> 坐标轴</label>
  <span class="sep"></span>
  <span class="hint" id="hintBar">左键选物体 · 拖 gizmo 移动 · Shift+左键 平移视角 · 滚轮缩放</span>
</header>

<!-- 物体列表 -->
<aside id="tree">
  <div class="panel-head">
    <span>物体</span>
    <input id="search" type="search" placeholder="搜索 id / 类型">
  </div>
  <ul id="treeList"></ul>
</aside>

<!-- 属性面板 -->
<aside id="props">
  <div class="panel-head"><span>属性</span><span id="propTarget" class="tag">未选中</span></div>
  <div id="propBody" class="prop-body">
    <p class="empty">在视口里点一个物体，或用左侧列表选中</p>
  </div>
</aside>

<!-- 底部状态 -->
<footer id="statusbar">
  <span id="statSel">未选中</span>
  <span class="sep"></span>
  <span id="statCount"></span>
  <span class="sep"></span>
  <span id="statDirty">已保存</span>
</footer>

<div id="dropZone" class="hidden">松开以载入场景 JSON</div>

<!-- 新增物体弹窗 -->
<div id="addDlg" class="dlg hidden">
  <div class="dlg-box">
    <h3>新增物体</h3>
    <label class="fld"><span>名字</span><input id="addName" type="text" placeholder="比如 课桌 2-3 / 黑板擦"></label>
    <label class="fld"><span>类型</span>
      <select id="addType">
        <option value="prefab">prefab（现成零件）</option>
        <option value="box">box（盒体）</option>
        <option value="sphere">sphere（球）</option>
        <option value="tube">tube（管）</option>
        <option value="polyline">polyline（折线）</option>
        <option value="group">group（空组）</option>
        <option value="empty">empty（空物体，无任何几何）</option>
      </select>
    </label>
    <label class="fld" id="addPrefabRow"><span>零件</span>
      <select id="addPrefab"></select>
    </label>
    <div class="fld"><span>放在</span>
      <label class="toggle"><input type="radio" name="addWhere" value="view" checked> 视角中心</label>
      <label class="toggle"><input type="radio" name="addWhere" value="origin"> 坐标原点</label>
    </div>
    <div class="dlg-actions">
      <button id="addCancel">取消</button>
      <button id="addConfirm" class="primary">创建</button>
    </div>
  </div>
</div>

<script type="module" src="./editor-ui.js"></script>
</body>
</html>
